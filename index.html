<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Pomodoro Timer</h1>

    <div id="mode" role="status" aria-label="Modo actual">
      <span id="mode-label">Work</span>
    </div>

    <div id="timer">
      <time id="time-display" role="timer" aria-live="off" aria-atomic="true">25:00</time>
    </div>

    <div id="notification" class="notification hidden" aria-live="assertive" role="status">
      <p id="notification-text"></p>
    </div>

    <div id="controls" role="group" aria-label="Controles del temporizador">
      <button id="btn-start" aria-describedby="time-display">Start</button>
      <button id="btn-pause" aria-describedby="time-display">Pause</button>
      <button id="btn-reset" aria-describedby="time-display" aria-label="Reiniciar temporizador">Reset</button>
    </div>

    <footer id="completed">
      <p>Pomodoros completed: <span id="pomodoro-count">0</span></p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>

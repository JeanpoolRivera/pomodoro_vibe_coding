<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Pomodoro Timer</h1>

    <section id="mode">
      <span id="mode-label">Work</span>
    </section>

    <section id="timer">
      <time id="time-display">25:00</time>
    </section>

    <section id="notification" class="notification hidden" aria-live="polite" role="alert">
      <p id="notification-text"></p>
    </section>

    <section id="controls">
      <button id="btn-start">Start</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-reset">Reset</button>
    </section>

    <footer id="completed">
      <p>Pomodoros completed: <span id="pomodoro-count">0</span></p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
